name: Build Match 33290

on:
  workflow_dispatch:

concurrency:
  group: build-match-33290
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
          - target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v3.3.0-ksu33290-allow
          fetch-depth: 0

      - name: Patch dead Kernel-SU git deps to ReSukiSU mirrors
        run: |
          set -eux
          cd userspace/ksud
          sed -i 's#https://github.com/Kernel-SU/java-properties.git#https://github.com/ReSukiSU/java-properties.git#' Cargo.toml
          sed -i 's#https://github.com/Kernel-SU/ksu_props#https://github.com/ReSukiSU/ksu_props#' Cargo.toml
          sed -i 's#https://github.com/Kernel-SU/rustix.git#https://github.com/ReSukiSU/rustix.git#' ../ksuinit/Cargo.toml
          grep -rn "Kernel-SU/" . ../ksuinit/ || echo "PATched-all"
          grep -rn "kernel-su\|Kernel-SU" ../../Cargo.toml 2>/dev/null || true

      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud
          cache-targets: false
          cache-bin: false

      - name: Install cross
        run: |
          RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

      - name: Assemble LKM bootstrap
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S

      - name: Build ksud
        env:
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: >
            --sysroot=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -I$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/aarch64-linux-android
            -I$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
        run: CROSS_NO_WARNINGS=0 cross build --target ${{ matrix.target }} --release --manifest-path ./userspace/ksud/Cargo.toml

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v7
        with:
          name: ksud-${{ matrix.target }}
          path: userspace/ksud/target/**/release/ksud*

  build-manager:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v3.3.0-ksu33290-allow
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK + licenses
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT"
          echo "--- cmdline-tools ---"
          ls "$ANDROID_SDK_ROOT/cmdline-tools/" 2>/dev/null || true
          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses || true
          yes | "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;29.0.14206865" || true
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null

      - name: Download arm64 ksud
        uses: actions/download-artifact@v7
        with:
          name: ksud-aarch64-linux-android
          path: .

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v7
        with:
          name: ksud-x86_64-linux-android
          path: .

      - name: Copy ksud to app jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          ls -R ../aarch64-linux-android/release/ | head -20
          cp -f ../aarch64-linux-android/release/ksud app/src/main/jniLibs/arm64-v8a/libksud.so
          cp -f ../x86_64-linux-android/release/ksud app/src/main/jniLibs/x86_64/libksud.so

      - name: Build with Gradle
        run: ./gradlew clean assembleRelease assembleDebug

      - name: Upload manager APK
        uses: actions/upload-artifact@v7
        with:
          name: manager-33290
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Upload manager DEBUG APK
        uses: actions/upload-artifact@v7
        with:
          name: manager-33290-debug
          path: manager/app/build/outputs/apk/debug/*.apk